[project]
name = "syndrome-out"
version = "0.1.0"
description = "Lights Out for the rotated surface code: clear the syndrome without causing a logical error"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Akira Ishino", email = "akira@lumilab.jp" }]
dependencies = [
    "numpy>=2.0",
    "pyxel>=2.2",
    "pymatching>=2.2",
]

[project.scripts]
syndrome-out = "syndrome_out.app:main"

[dependency-groups]
dev = [
    "pyinstaller>=6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["syndrome-out/syndrome_out"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
